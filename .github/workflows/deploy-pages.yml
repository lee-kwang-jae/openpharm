name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않고 끝까지 둔다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BASE: /openpharm/
      # 카카오맵 JavaScript 키는 어차피 클라이언트 번들에 그대로 실려서
      # 비밀이 될 수 없다. 대신 카카오 콘솔의 도메인 등록으로 보호된다.
      VITE_KAKAO_MAP_KEY: 02db80270ff8b0a99f3f6ec451075795
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # 한 번 당한 적 있는 사고를 막는다. Pages 가 브랜치 방식(Jekyll)으로
      # 저장소 루트를 그대로 퍼블리시하면 원본 index.html 이 올라가고,
      # 브라우저가 /src/main.tsx 를 404 로 받아 화면이 통째로 빈다.
      # 빌드 결과물이 맞는지 여기서 확인하고, 아니면 배포하지 않는다.
      - name: 빌드 결과물 검증
        run: |
          test -f dist/index.html || { echo "dist/index.html 이 없어요."; exit 1; }
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "dist/index.html 이 원본 소스를 가리키고 있어요. vite build 가 제대로 안 돌았습니다."
            exit 1
          fi
          grep -q '/openpharm/assets/' dist/index.html || {
            echo "자산 경로에 base(/openpharm/)가 안 붙었어요. DEPLOY_BASE 를 확인하세요."
            exit 1
          }
          echo "확인 완료:"
          cat dist/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
